[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsar-benchmark"
version = "0.1.0"
description = "Transparent, leakage-aware QSAR benchmarking tools."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi<0.124",
    "numpy==2.5.4",
    "pandas>=3.1.0",
    "python-multipart>=0.0.32",
    "rdkit==2025.9.6",
    "scikit-learn==1.7.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
test = [
    "pytest==8.4.2",
]

[tool.uv]
default-groups = ["test", "dev"]
constraint-dependencies = [
    "joblib==1.5.2",
    "scipy==1.16.2",
    "threadpoolctl==3.6.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["qsar_benchmark*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
